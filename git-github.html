<body>
  <h1>¿Qué es Git?</h1>
  <p>Git es un sistema de control de versiones que permite llevar un historial de los cambios realizados en un proyecto.</p>

  <h1>¿Qué es GitHub?</h1>
  <p>GitHub es una plataforma que permite alojar repositorios Git en la nube y colaborar con otras personas en proyectos.</p>
